[project]
name = "cloud-loop-demo"
version = "0.1.0"
description = "NanoBot cloud agent with a replaceable mock edge capability"
requires-python = ">=3.11"
dependencies = [
  "nanobot-ai==0.3.0",
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.52.4,<0.53",
  "httpx[socks]>=0.28.1,<0.29",
  "mcp>=1.30.0,<2",
  "jsonschema>=4.26,<5",
  "pyyaml>=6.0.3,<7",
  "imageio-ffmpeg==0.6.0",
  "av==16.0.1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pypinyin==0.55.0",
]

[project.scripts]
cloud-loop = "cloud_loop.cli:main"

[project.optional-dependencies]
voice-mac = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
voice-stream = ["sherpa-onnx==1.13.8"]
channels = [
    "lark-oapi>=1.5.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_loop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
