<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse · 对话</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/harness-static/harness.css"><link rel="stylesheet" href="/harness-static/harness-autonomy-board.css"></head>
<body>
<link rel="stylesheet" href="/harness-static/harness-runtime-status.css">
<script src="/harness-static/harness-runtime-status.js"></script>
<header class="appbar"><button id="toggleDirectory" aria-label="打开对话列表" aria-expanded="false">☰</button><a class="brand" href="/">muse</a><div id="connectionSummary" aria-live="polite"></div><button id="openDevices" class="icon-button" aria-haspopup="dialog">设备状态</button><button id="openSettings" class="icon-button">设置</button><button id="homeLogout" class="icon-button" hidden>退出登录</button></header>
<div class="shell"><aside id="directory" class="directory" aria-label="对话与任务"><div class="directory-heading"><span>对话</span><button id="closeDirectory" aria-label="关闭对话列表">×</button></div><div id="nodes"></div><button id="openAutonomy" class="muse-activity-link" aria-haspopup="dialog" aria-expanded="false" aria-controls="autonomyBoard"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h8M4 15h5"/><circle cx="15" cy="14" r="3"/></svg><span>Muse 动态<small>记录与安排</small></span><span class="activity-arrow" aria-hidden="true">›</span></button><button id="newWork" class="new-work">＋ 新任务</button><div class="list-heading">任务 <span id="taskCount"></span></div><div id="tasks"></div><div class="sidebar-bottom"><button id="openScene">现场预览</button></div></aside>
<button id="directoryShade" class="shade" aria-label="关闭对话列表" hidden></button>
<main>
<header class="conversation-heading"><div><p id="sideLabel" class="eyebrow"></p><h1 id="conversationTitle">正在连接…</h1><p id="conversationMeta" class="muted"></p></div><div class="heading-actions"><button id="taskDetail" hidden>任务详情</button><button id="openLibraryCompact" aria-label="打开视频相册">视频</button><button id="openSceneCompact" aria-label="打开现场预览">现场</button></div></header>
<div id="connectionNotice" class="connection-notice" role="status" hidden><span id="connectionText"></span><button id="retryConnection">重试连接</button></div>
<div id="notice" role="alert" hidden></div>
<section id="runtimeStatus" aria-label="录像、判断和云端运行情况" aria-live="polite" hidden></section>
<div class="task-actions" id="taskActions" hidden><span id="taskState"></span><button id="pauseTask">暂停</button><button id="cancelTask" class="danger">取消任务</button></div>
<div class="chat-scroll" id="chatScroll"><button id="older" class="subtle" hidden>更早的消息</button><section id="messages" class="messages" aria-live="polite"></section><section id="taskAssets" class="task-assets" aria-label="本任务成果" hidden></section></div>
<form id="composer"><label class="sr-only" id="inputLabel" for="prompt">发送消息</label><textarea id="prompt" rows="2" maxlength="8000" required placeholder="说说你想做什么…"></textarea><div class="composer-foot"><span id="inputHint"></span><button id="send" class="primary" type="submit">发送 ↑</button></div></form>
</main></div>
<dialog id="sceneDialog" class="panel-dialog observation-dialog"><header class="panel-heading"><div><p class="eyebrow">现场</p><h2>现场预览</h2></div><button data-close="sceneDialog" aria-label="关闭现场预览">×</button></header><p id="observationNotice" role="status" class="muted">正在读取端侧状态…</p><label for="observationSource">画面来源</label><select id="observationSource"></select><div class="observation-viewfinder"><video id="observationVideo" controls muted preload="metadata" hidden></video><audio id="observationAudio" controls preload="metadata" hidden></audio><p id="observationPreviewEmpty">尚未配置影音来源</p><span id="observationSourceBadge" class="preview-badge" hidden>文件回放</span></div><div class="observation-toolbar"><button id="playObservation" class="primary">播放 / 从头重播</button><div><p id="observationPreviewStatus" class="muted"></p><p id="observationProgress" class="muted"></p></div><button id="followObservation" hidden>跳到最近记录位置</button></div><section id="observationGimbals" aria-label="手动云台控制" hidden></section><label for="observationTask">查看观察任务</label><select id="observationTask"></select><section id="observationTasks" aria-label="持续观察任务"></section><section aria-label="保留的视频" hidden><h3>保留的视频</h3><div id="observationSavedVideos"></div></section><button id="setupObservation">设置观察任务</button></dialog>
<dialog id="taskDialog" class="panel-dialog"><header class="panel-heading"><h2>任务详情</h2><button data-close="taskDialog" aria-label="关闭任务详情">×</button></header><div id="taskSummary"></div><section id="taskSchedule"><h3>执行计划</h3><div id="rules"></div></section></dialog>
<dialog id="devicesDialog" class="panel-dialog" aria-labelledby="devicesTitle">
<header class="panel-heading"><h2 id="devicesTitle">设备与服务</h2><button data-close="devicesDialog" aria-label="关闭设备状态">×</button></header>
<div id="deviceRows" class="device-rows"></div>
<footer class="device-footer"><span id="devicesChecked" class="muted" role="status"></span><button id="refreshDevices" type="button">刷新状态</button></footer>
</dialog>
<dialog id="settingsDialog" class="panel-dialog"><header class="panel-heading"><h2>设置与连接</h2><button data-close="settingsDialog" aria-label="关闭设置">×</button></header><section id="observationSettings"><h3>端侧观察</h3><p id="observationConfigStatus" class="muted">正在读取配置…</p><form id="observationForm"><label>观察目标<textarea id="observationGoal" rows="2" maxlength="8000" placeholder="例如：帮我录一下我家猫的视频" required></textarea></label><div id="observationNamedFields" hidden><p id="observationExecutorStatus" class="muted" role="status"></p><label>执行单元<select id="observationExecutor"></select></label><label>采样档位<select id="observationSampling"></select></label><p class="muted">使用已安装的模型与保存能力，交给家庭助理形成任务条件并启动。原音轨保留，环境声音理解未提供。</p></div><div id="observationLegacyFields"><div class="settings-pair"><label>影音来源<select id="observationConfigSource" required></select></label><label>观察模型<select id="observationModel" required></select><span id="observationModelStatus" class="muted" role="status" aria-live="polite">正在读取模型状态…</span></label><label>视频保存位置<select id="observationStorage" required></select></label><label>保存策略<select id="observationSave" required></select></label></div><details><summary>采样与工具选择</summary><label>采样方案<select id="observationBatch"></select></label><label>云台<select id="observationGimbal"></select></label><div id="observationToolChoices"></div><div id="observationSkillChoices"></div></details></div><button id="saveObservation" class="primary">新建观察任务</button></form><p id="observationSaved" role="status" class="muted"></p></section><details id="voiceSettings"><summary>语音与唤醒词</summary><form id="wakeForm"><div class="settings-pair"><label for="wakeWord">唤醒词（每行一个）<textarea id="wakeWord" rows="2" maxlength="164" required>muse</textarea></label><label for="followupSeconds">回复后免唤醒追问（秒）<input id="followupSeconds" type="number" min="5" max="300" step="1" value="30" required></label></div><button id="saveWake">保存语音设置</button></form><p class="muted">时长只决定再次说话是否需要唤醒词，不会清空主对话。</p><p class="muted">文件转写和文字门控已接入；声学唤醒和扬声器仍待验收；录像麦克风以默认录像设备和实际音轨为准。</p><details><summary>模拟转写测试</summary><form id="voiceForm"><label for="voiceText">明确标记为模拟输入</label><input id="voiceText" value="muse，现在几点了？" maxlength="8000"><button>送入唤醒入口</button></form></details><p id="voiceResult" class="muted"></p></details><details id="hardwareSettings"><summary>摄像头接入与设备预览</summary><p class="muted">持续录像在“默认录像”区管理；本区用于回看已登记的视频。</p><section class="media-panel"><div><label for="sourceSelect">已登记视频源</label><select id="sourceSelect"></select><video id="sourceVideo" controls preload="none" hidden></video><p id="sourceInfo" class="muted"></p><form id="seekForm" class="inline"><label for="position">跳转秒数</label><input id="position" type="number" min="0" step="0.001" value="0"><button>查看一帧</button></form><img id="frameImage" alt="文件回放指定时间帧" hidden><p id="frameInfo" class="muted"></p></div><div id="scene" hidden></div></section></details><div id="components"></div></dialog>
<dialog id="recordDialog" class="panel-dialog"><header class="panel-heading"><h2 id="dialogTitle">原始记录</h2><button id="closeDialog" aria-label="关闭记录">×</button></header><pre id="dialogContent"></pre></dialog>
<script src="/harness-static/harness-playback.js"></script><script src="/harness-static/harness-rich-text.js"></script><script src="/harness-static/harness.js"></script><script src="/harness-static/harness-voice.js"></script><script src="/harness-static/harness-components.js"></script><script src="/harness-static/harness-gimbal.js"></script><script src="/harness-static/harness-observation.js"></script><script src="/harness-static/harness-markers.js"></script><script src="/harness-static/harness-gallery.js"></script><script src="/harness-static/harness-autonomy.js"></script><script src="/harness-static/harness-autonomy-board.js"></script><script src="/harness-static/harness-recording-settings.js"></script><script src="/harness-static/harness-channels.js"></script><script src="/harness-static/harness-devices.js"></script><script src="/harness-static/harness-delivery.js"></script><script src="/harness-static/home-session.js"></script></body></html>
