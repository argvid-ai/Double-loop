<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>右手动作预览</title>
<style>
  :root { color-scheme: dark; font: 16px Inter, system-ui, sans-serif; color: #eef4f7; background: #0c151c; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 1120px; padding: 28px 22px; }
  header, .line { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.35rem); }
  p { margin: 10px 0 0; color: #b6c6cc; line-height: 1.55; }
  .camera { display: block; width: 100%; margin-top: 22px; aspect-ratio: 16 / 9; background: #14232c; border-radius: 12px; }
  .panel { margin-top: 16px; background: #14232c; border: 1px solid #2c424c; padding: 16px; border-radius: 12px; }
  .axes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin: 18px 0; }
  .axis { display: grid; gap: 8px; min-width: 0; }
  .axis output { color: #73e7c5; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .axis small, #stats { color: #b6c6cc; font-size: 0.82rem; }
  .rail { height: 8px; position: relative; border-radius: 6px; background: #2b444e; }
  .rail::before { content: ''; position: absolute; left: 50%; top: -3px; width: 2px; height: 14px; background: #ccd9df; }
  .mark { position: absolute; height: 12px; width: 12px; border-radius: 100%; top: -2px; left: 50%; transform: translateX(-50%); background: #73e7c5; }
  button { border: 0; border-radius: 7px; padding: 10px 16px; background: #79e8c8; color: #0b221c; font: inherit; font-weight: 650; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
<header>
  <h1>右手动作预览</h1>
  <span>O6N · C60E · 仅视觉</span>
</header>
<p>先看绿色人体框和右臂骨架。确认双肩、右肘和右腕入画后，点「8 秒后归零」并自然放下右手。</p>
<img class="camera" src="/stream" alt="C60E 实时镜像画面、人体检测框和右臂骨架">
<section class="panel" aria-label="动作目标">
  <div class="line">
    <strong id="state" aria-live="polite">正在连接 O6N…</strong>
    <button id="zero" type="button" disabled>8 秒后归零</button>
  </div>
  <div class="axes">
    <div class="axis">
      <div class="line"><span>X · 横向</span><output id="x-value">—</output></div>
      <div class="rail"><span class="mark" id="x-mark" hidden></span></div>
      <div class="line"><small>你的左</small><small>你的右</small></div>
    </div>
    <div class="axis">
      <div class="line"><span>Y · 竖向</span><output id="y-value">—</output></div>
      <div class="rail"><span class="mark" id="y-mark" hidden></span></div>
      <div class="line"><small>下</small><small>上</small></div>
    </div>
  </div>
  <small id="stats">—</small>
</section>
<script>
  const labels = {
    starting: '正在启动相机…', needs_zero: '右臂已识别，请设零位',
    lock_waiting: '面对相机举右手，保持左手放下', operator_lost: '已锁定的人暂时出画或被遮挡',
    zero_lower_hand: '请把右手垂到身侧，再保持不动',
    zero_waiting: '等待单人入画，请正对相机并自然放下右手',
    zeroing: '正在设零位，请保持右手不动', tracking: '正在跟踪右手',
    no_person: '未识别到人', multiple: '检测到多人，请只留一人在画面中',
    weak_points: '右臂关键点不足，请调整站位', camera_error: '相机取帧失败', stale: '等待新帧',
  };
  const state = document.querySelector('#state');
  const zero = document.querySelector('#zero');
  const stats = document.querySelector('#stats');
  let posting = false;
  let audioContext;
  let requestedZero = null;
  function beep() {
    if (!audioContext || audioContext.state !== 'running') return;
    const tone = audioContext.createOscillator();
    const volume = audioContext.createGain();
    const start = audioContext.currentTime;
    tone.frequency.value = 740;
    volume.gain.setValueAtTime(0.14, start);
    volume.gain.exponentialRampToValueAtTime(0.001, start + 0.24);
    tone.connect(volume).connect(audioContext.destination);
    tone.start(start);
    tone.stop(start + 0.25);
  }
  function axis(id, value, negative, positive) {
    const marker = document.querySelector(`#${id}-mark`);
    const output = document.querySelector(`#${id}-value`);
    marker.hidden = value == null;
    if (value == null) {
      output.textContent = '—';
      return;
    }
    marker.style.left = `${50 + value / 2}%`;
    const direction = value > 0 ? positive : (value < 0 ? negative : '居中');
    output.textContent = `${value > 0 ? '+' : ''}${value}% ${direction}`;
  }
  async function tick() {
    try {
      const response = await fetch('/status', {signal: AbortSignal.timeout(1500), cache: 'no-store'});
      if (!response.ok) throw new Error(response.status);
      const data = await response.json();
      const message = data.state === 'zero_countdown'
        ? `${data.countdown} 秒后开始归零，请走到相机前`
        : data.person_box && data.state === 'weak_points'
          ? '已框到人，请让双肩、右肘和右腕入画'
          : labels[data.state] || '等待预览';
      if (state.textContent !== message) state.textContent = message;
      zero.disabled = posting || !['needs_zero', 'tracking', 'no_person', 'weak_points', 'multiple'].includes(data.state);
      if (requestedZero !== null && requestedZero === data.zero_request &&
          !['zero_countdown', 'zero_waiting', 'zero_lower_hand', 'zeroing'].includes(data.state)) {
        if (data.state === 'tracking') beep();
        requestedZero = null;
      }
      axis('x', data.target?.[0], '左', '右');
      axis('y', data.target?.[1], '下', '上');
      const points = data.point_confidence?.map(value => value.toFixed(2)).join(' / ');
      stats.textContent = data.frame ? `${data.fps} fps · NPU ${data.npu_ms} ms` +
        (points ? ` · 双肩 / 右肘 / 右腕置信度 ${points}` : '') : '—';
    } catch {
      state.textContent = '与 O6N 的连接已断开';
      zero.disabled = true;
      axis('x', null);
      axis('y', null);
      stats.textContent = '—';
    }
    setTimeout(tick, 170);
  }
  zero.addEventListener('click', async () => {
    posting = zero.disabled = true;
    if (window.AudioContext) {
      audioContext ??= new AudioContext();
      audioContext.resume().catch(() => {});
    }
    try {
      const response = await fetch('/zero', {method: 'POST', headers: {'X-Pose-Preview': '1'}, signal: AbortSignal.timeout(1500)});
      if (!response.ok) throw new Error(response.status);
      requestedZero = (await response.json()).zero_request;
    } catch {
      state.textContent = '归零请求未送达';
    } finally {
      posting = false;
    }
  });
  tick();
</script>
</html>
